{% extends "admin/base.html" %}
{% block title %}Change Password | Samunnathi Admin{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/forms.css') }}" />{% endblock %}

{% block content %}
<div class="panel" style="max-width:480px;">
  <div class="panel__head"><h2>Change Password</h2></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-group" style="margin-bottom:1rem;">
      <label for="current_password">Current Password</label>
      <input class="form-control" type="password" id="current_password" name="current_password" required>
    </div>
    <div class="form-group" style="margin-bottom:1rem;">
      <label for="new_password">New Password</label>
      <input class="form-control" type="password" id="new_password" name="new_password" minlength="8" required>
    </div>
    <div class="form-group" style="margin-bottom:1.25rem;">
      <label for="confirm_password">Confirm New Password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
</div>
{% endblock %}
